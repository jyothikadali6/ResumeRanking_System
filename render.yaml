# Render Blueprint — backend web service + managed Postgres.
# Deploy: push to GitHub, then in Render click "New +" -> "Blueprint" and
# point it at this repo. Render reads this file and provisions everything.
#
# NOTE: This uses Render's FREE plans (no card required). Trade-offs:
#   - 512MB RAM: the ML stack (torch) is tight and MAY crash on large batches.
#     If ranking fails with out-of-memory, upgrade `plan` to `starter`.
#   - No persistent disk on free tier: the embedding model re-downloads on each
#     cold start, and uploaded PDFs don't survive restarts (fine for a single
#     upload -> rank session).
#   - Free Postgres expires ~30 days after creation.
services:
  - type: web
    name: resume-ranker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-ranker-db
          property: connectionString
      # Ollama is not available on Render — run without the LLM (graceful fallback).
      - key: USE_LLM
        value: "false"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: SEMANTIC_WEIGHT
        value: "0.7"
      - key: SKILL_WEIGHT
        value: "0.3"
      # IMPORTANT: set this to your Vercel URL after the frontend is deployed,
      # e.g. https://resume-ranking-system.vercel.app
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: resume-ranker-db
    plan: free
    databaseName: resume_ranker
